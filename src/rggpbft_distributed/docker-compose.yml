# RGG-PBFT Distributed Consensus Experiment
# M=16 nodes, with grouping K_g=4
# Run: docker compose up --build
version: "3.8"

services:
  collector:
    build: .
    container_name: collector
    command: python collector.py
    ports:
      - "9999:9999"
    networks:
      consensus_net:
        ipv4_address: 10.10.0.100

  driver:
    build: .
    container_name: driver
    command: python driver.py
    environment:
      - M=16
      - PRIMARY=0
      - N_ROUNDS=5
      - PORT_BASE=9000
    depends_on:
      - node0
      - node1
      - node2
      - node3
      - node4
      - node5
      - node6
      - node7
      - node8
      - node9
      - node10
      - node11
      - node12
      - node13
      - node14
      - node15
    networks:
      consensus_net:

  node0:
    build: .
    container_name: node0
    environment:
      - NODE_ID=0
      - M=16
      - K_G=4
      - DELAY_MS=5
      - N_ROUNDS=5
      - PORT_BASE=9000
      - COLLECTOR_HOST=collector
      - COLLECTOR_PORT=9999
    ports:
      - "9000:9000"
    networks:
      consensus_net:
        ipv4_address: 10.10.0.10

  node1:
    build: .
    container_name: node1

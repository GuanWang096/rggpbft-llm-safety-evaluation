[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rggpbft-llm-safety-evaluation"
version = "2.0.0"
description = "Reproduction package for reliability-aware aggregation of multimodal LLM safety judges"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "pillow>=11",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
gpu = [
  "accelerate==1.12.0",
  "einops==0.8.1",
  "modelscope-hub==0.1.6",
  "pillow==11.3.0",
  "safetensors==0.7.0",
  "sentencepiece==0.2.1",
  "timm==1.0.22",
  "torch",
  "torchvision",
  "tqdm==4.67.1",
  "transformers==4.57.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "e1_pipeline*",
  "multijudge*",
  "multijudge_workflows*",
  "rggpbft*",
  "rggpbft_distributed*",
]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "--import-mode=prepend"
pythonpath = ["src"]
